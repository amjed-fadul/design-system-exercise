name: Dev Verify

on:
  push:
    branches: [feat/foundations-storybook]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Materialize implementation
        if: ${{ hashFiles('.github/bootstrap.py') != '' }}
        run: python .github/bootstrap.py
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --no-frozen-lockfile
      - name: Commit implementation and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/dev-verify.yml
          git add -A
          git reset -- .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement foundations and Storybook"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: pnpm -r list --depth -1
      - run: pnpm tokens:validate
      - run: pnpm tokens:build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build-storybook
