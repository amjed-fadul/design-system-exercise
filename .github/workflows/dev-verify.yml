name: Dev Verify

on:
  push:
    branches: [feat/foundations-storybook]

concurrency:
  group: dev-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r list --depth -1
      - run: pnpm tokens:validate
      - run: pnpm tokens:build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build-storybook
      - name: Pack and smoke-test tokens package
        shell: bash
        run: |
          PACK_DIR="$RUNNER_TEMP/design-system-exercise-pack"
          CONSUMER_DIR="$RUNNER_TEMP/design-system-exercise-consumer"
          mkdir -p "$PACK_DIR" "$CONSUMER_DIR"
          pnpm --dir packages/tokens pack --pack-destination "$PACK_DIR"
          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install "$TARBALL" --ignore-scripts >/dev/null
          node --input-type=module <<'NODE'
          import { tokens } from '@design-system-exercise/tokens';
          import { existsSync } from 'node:fs';
          if (tokens.color.primitive.brand['600'] !== '#005DCC') throw new Error('brand/600 export mismatch');
          if (tokens.typography.semantic.arabic.headline.page.family !== 'IBM Plex Sans Arabic') throw new Error('Arabic font export mismatch');
          if (!existsSync('node_modules/@design-system-exercise/tokens/dist/tokens.css')) throw new Error('CSS export missing');
          NODE
