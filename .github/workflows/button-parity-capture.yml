name: Capture Button parity

on:
  push:
    branches: [feat/contracts-button]
    paths:
      - .github/workflows/button-parity-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build
      - run: pnpm --filter @design-system-exercise/storybook build-storybook
      - name: Render Button stories in Chromium
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/button-parity"
          mkdir -p "$OUT"
          python3 -m http.server 6006 --directory apps/storybook/storybook-static >"$RUNNER_TEMP/storybook-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:6006/index.json >/dev/null && break
            sleep 1
          done
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          capture() {
            local name="$1"
            local url="$2"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=5000 --run-all-compositor-stages-before-draw \
              --window-size=900,520 --screenshot="$OUT/$name.png" "$url"
            test -s "$OUT/$name.png"
          }
          BASE='http://127.0.0.1:6006/iframe.html?viewMode=story'
          capture light-en "$BASE&id=components-controls-button--emphasis-matrix&globals=theme:light;language:english"
          capture dark-en "$BASE&id=components-controls-button--emphasis-matrix&globals=theme:dark;language:english"
          capture light-ar "$BASE&id=components-controls-button--emphasis-matrix&globals=theme:light;language:arabic"
          capture dark-ar "$BASE&id=components-controls-button--emphasis-matrix&globals=theme:dark;language:arabic"
          capture loading "$BASE&id=components-controls-button--loading&globals=theme:light;language:english"
          capture disabled "$BASE&id=components-controls-button--disabled&globals=theme:light;language:english"
          capture leading-ar "$BASE&id=components-controls-button--with-leading-icon&globals=theme:light;language:arabic"
          capture trailing-ar "$BASE&id=components-controls-button--with-trailing-icon&globals=theme:light;language:arabic"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: button-parity
          path: ${{ runner.temp }}/button-parity/*.png
          if-no-files-found: error
