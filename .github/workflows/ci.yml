name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:validate
      - run: pnpm tokens:validate
      - run: pnpm tokens:build
      - run: pnpm --filter @design-system-exercise/react build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build-storybook
      - name: Pack and smoke-test tokens and React packages
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/design-system-exercise-pack"
          CONSUMER_DIR="$RUNNER_TEMP/design-system-exercise-consumer"
          mkdir -p "$PACK_DIR" "$CONSUMER_DIR"

          pnpm --dir packages/tokens pack --pack-destination "$PACK_DIR"
          pnpm --dir packages/react pack --pack-destination "$PACK_DIR"

          TOKEN_TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*tokens*.tgz' -print -quit)"
          REACT_TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*react*.tgz' -print -quit)"
          test -n "$TOKEN_TARBALL"
          test -n "$REACT_TARBALL"

          TOKEN_CONTENTS="$(tar -tzf "$TOKEN_TARBALL")"
          printf '%s\n' "$TOKEN_CONTENTS"
          printf '%s\n' "$TOKEN_CONTENTS" | grep -qx 'package/package.json'
          printf '%s\n' "$TOKEN_CONTENTS" | grep -qx 'package/dist/index.js'
          printf '%s\n' "$TOKEN_CONTENTS" | grep -qx 'package/dist/index.d.ts'
          printf '%s\n' "$TOKEN_CONTENTS" | grep -qx 'package/dist/tokens.css'
          ! printf '%s\n' "$TOKEN_CONTENTS" | grep -Eq 'package/(scripts|tests|\.generated|storybook)/'

          REACT_CONTENTS="$(tar -tzf "$REACT_TARBALL")"
          printf '%s\n' "$REACT_CONTENTS"
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/package.json'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/index.js'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/index.d.ts'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/styles.css'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/assets/loader-circle.svg'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/assets/search.svg'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/assets/x.svg'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/assets/inline-feedback-alert.svg'
          printf '%s\n' "$REACT_CONTENTS" | grep -qx 'package/dist/assets/inline-feedback-check.svg'
          ! printf '%s\n' "$REACT_CONTENTS" | grep -Eq 'package/(src|scripts|tests|storybook|contracts)/'
          ! printf '%s\n' "$REACT_CONTENTS" | grep -Eq '\.(test|stories)\.'
          ! printf '%s\n' "$REACT_CONTENTS" | grep -Eq '\.contract\.json$'
          ! tar -xOf "$REACT_TARBALL" package/dist/index.js | grep -q 'InputControl'
          ! tar -xOf "$REACT_TARBALL" package/dist/index.d.ts | grep -q 'InputControl'
          ! tar -xOf "$REACT_TARBALL" package/dist/index.js | grep -q 'RadioOption'
          ! tar -xOf "$REACT_TARBALL" package/dist/index.d.ts | grep -q 'RadioOption'

          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install "$TOKEN_TARBALL" react@19.3.0 react-dom@19.3.0 --ignore-scripts >/dev/null
          npm install "$REACT_TARBALL" --ignore-scripts >/dev/null

          node --input-type=module <<'NODE'
          import React from 'react';
          import { existsSync, readFileSync } from 'node:fs';
          import { renderToStaticMarkup } from 'react-dom/server';
          import { tokens } from '@design-system-exercise/tokens';
          import * as ReactPackage from '@design-system-exercise/react';

          const { Button, IconButton, Link, TextField, SearchField, RadioGroup, InlineFeedback } = ReactPackage;
          if ('InputControl' in ReactPackage) throw new Error('Private InputControl leaked through public package exports');
          if ('RadioOption' in ReactPackage) throw new Error('Private RadioOption leaked through public package exports');

          let radioOptionDeepImportBlocked = false;
          try {
            await import('@design-system-exercise/react/internal/radio-option/RadioOption.js');
          } catch (error) {
            if (error?.code === 'ERR_PACKAGE_PATH_NOT_EXPORTED') radioOptionDeepImportBlocked = true;
            else throw error;
          }
          if (!radioOptionDeepImportBlocked) {
            throw new Error('Private RadioOption is reachable through a package subpath');
          }

          if (tokens.color.primitive.brand['600'] !== '#005DCC') throw new Error('brand/600 export mismatch');
          if (tokens.typography.semantic.arabic.body.default.family !== 'IBM Plex Sans Arabic') throw new Error('Arabic body font export mismatch');

          const tokenCssUrl = import.meta.resolve('@design-system-exercise/tokens/css');
          if (!tokenCssUrl.endsWith('/dist/tokens.css')) throw new Error(`Unexpected token CSS export: ${tokenCssUrl}`);
          if (!existsSync(new URL(tokenCssUrl))) throw new Error('Token CSS export missing');

          const buttonHtml = renderToStaticMarkup(
            React.createElement(Button, { emphasis: 'secondary', tone: 'critical' }, 'Remove'),
          );
          if (!buttonHtml.includes('<button')) throw new Error('Button did not render a native button');
          if (!buttonHtml.includes('data-emphasis="secondary"')) throw new Error('Button emphasis missing');
          if (!buttonHtml.includes('data-tone="critical"')) throw new Error('Button tone missing');
          if (!buttonHtml.includes('type="button"')) throw new Error('Button safe default type missing');

          const iconButtonHtml = renderToStaticMarkup(
            React.createElement(IconButton, {
              icon: React.createElement('svg', { viewBox: '0 0 20 20' }),
              'aria-label': 'Close',
            }),
          );
          if (!iconButtonHtml.includes('<button')) throw new Error('Icon Button did not render a native button');
          if (!iconButtonHtml.includes('aria-label="Close"')) throw new Error('Icon Button accessible name missing');
          if (!iconButtonHtml.includes('type="button"')) throw new Error('Icon Button safe default type missing');
          if (!iconButtonHtml.includes('class="dse-icon-button"')) throw new Error('Icon Button class missing');
          if (!iconButtonHtml.includes('aria-hidden="true"')) throw new Error('Icon Button decorative icon semantics missing');

          const linkHtml = renderToStaticMarkup(
            React.createElement(
              Link,
              { href: '/workspace', target: '_self', 'aria-current': 'page' },
              'Workspace',
            ),
          );
          if (!linkHtml.includes('<a')) throw new Error('Link did not render a native anchor');
          if (!linkHtml.includes('href="/workspace"')) throw new Error('Link href missing');
          if (!linkHtml.includes('target="_self"')) throw new Error('Link native target missing');
          if (!linkHtml.includes('aria-current="page"')) throw new Error('Link native aria attribute missing');
          if (!linkHtml.includes('class="dse-link"')) throw new Error('Link class missing');
          if (!linkHtml.includes('>Workspace</a>')) throw new Error('Link visible content missing');

          const textFieldHtml = renderToStaticMarkup(
            React.createElement(TextField, {
              label: 'Email address',
              name: 'email',
              defaultValue: 'alex@example.com',
              supportingText: 'One person per invitation.',
              required: true,
            }),
          );
          if (!textFieldHtml.includes('<label')) throw new Error('Text Field visible label missing');
          if (!textFieldHtml.includes('<input')) throw new Error('Text Field did not render a native input');
          if (!textFieldHtml.includes('name="email"')) throw new Error('Text Field native name missing');
          if (!textFieldHtml.includes('value="alex@example.com"')) throw new Error('Text Field default value missing');
          if (!textFieldHtml.includes('required=""')) throw new Error('Text Field native required semantics missing');
          if (!textFieldHtml.includes('class="dse-text-field__input"')) throw new Error('Text Field input class missing');
          if (!textFieldHtml.includes('One person per invitation.')) throw new Error('Text Field supporting message missing');

          const labelFor = textFieldHtml.match(/<label[^>]*for="([^"]+)"/)?.[1];
          const inputId = textFieldHtml.match(/<input[^>]*id="([^"]+)"/)?.[1];
          if (!labelFor || !inputId || labelFor !== inputId) throw new Error('Text Field label/input association mismatch');

          const describedBy = textFieldHtml.match(/<input[^>]*aria-describedby="([^"]+)"/)?.[1];
          const messageId = textFieldHtml.match(/<div[^>]*id="([^"]+-message)"/)?.[1];
          if (!describedBy || !messageId || !describedBy.split(/\s+/).includes(messageId)) {
            throw new Error('Text Field supporting message association missing');
          }

          if (typeof SearchField !== 'object' && typeof SearchField !== 'function') {
            throw new Error('Search Field public export missing');
          }
          const searchFieldHtml = renderToStaticMarkup(
            React.createElement(SearchField, {
              'aria-label': 'Search team',
              clearButtonLabel: 'Clear search',
              name: 'member-query',
              defaultValue: 'sara',
            }),
          );
          if (!searchFieldHtml.includes('<input')) throw new Error('Search Field did not render a native input');
          if (!searchFieldHtml.includes('type="search"')) throw new Error('Search Field native search type missing');
          if (!searchFieldHtml.includes('aria-label="Search team"')) throw new Error('Search Field accessible name missing');
          if (!searchFieldHtml.includes('name="member-query"')) throw new Error('Search Field native name missing');
          if (!searchFieldHtml.includes('value="sara"')) throw new Error('Search Field default query missing');
          if (!searchFieldHtml.includes('data-size="compact"')) throw new Error('Search Field compact private shell missing');
          if (!searchFieldHtml.includes('class="dse-search-field__input"')) throw new Error('Search Field input class missing');
          if (!searchFieldHtml.includes('class="dse-icon-button"')) throw new Error('Search Field clear Icon Button missing');
          if (!searchFieldHtml.includes('aria-label="Clear search"')) throw new Error('Search Field clear accessible name missing');

          const lockedSearchHtml = renderToStaticMarkup(
            React.createElement(SearchField, {
              'aria-label': 'Search team',
              clearButtonLabel: 'Clear search',
              type: 'email',
              'aria-invalid': 'true',
            }),
          );
          if (!lockedSearchHtml.includes('type="search"')) throw new Error('Search Field type override escaped locked semantics');
          if (lockedSearchHtml.includes('aria-invalid')) throw new Error('Search Field validation semantics leaked into package output');

          if (typeof RadioGroup !== 'function') throw new Error('Radio Group public export missing');
          const radioGroupHtml = renderToStaticMarkup(
            React.createElement(RadioGroup, {
              label: 'Role',
              name: 'role',
              defaultValue: 'member',
              options: [
                {
                  value: 'member',
                  label: 'Member',
                  description: 'Use the workspace without managing people.',
                },
                {
                  value: 'admin',
                  label: 'Admin',
                  description: 'Invite people and manage members and roles.',
                },
              ],
            }),
          );
          if (!radioGroupHtml.includes('<fieldset')) throw new Error('Radio Group semantic fieldset missing');
          if (!radioGroupHtml.includes('<legend')) throw new Error('Radio Group semantic legend missing');
          if ((radioGroupHtml.match(/type="radio"/g) ?? []).length !== 2) throw new Error('Radio Group native radios missing');
          if ((radioGroupHtml.match(/name="role"/g) ?? []).length !== 2) throw new Error('Radio Group shared native name missing');
          if (!radioGroupHtml.includes('value="member"')) throw new Error('Radio Group Member value missing');
          if (!radioGroupHtml.includes('value="admin"')) throw new Error('Radio Group Admin value missing');
          if (!radioGroupHtml.includes('checked=""')) throw new Error('Radio Group default selection missing');
          if ((radioGroupHtml.match(/required=""/g) ?? []).length !== 2) throw new Error('Radio Group required semantics missing');
          if (!radioGroupHtml.includes('aria-labelledby=')) throw new Error('Radio Group option accessible-name binding missing');
          if (!radioGroupHtml.includes('aria-describedby=')) throw new Error('Radio Group option description binding missing');
          if (radioGroupHtml.includes('role="radiogroup"')) throw new Error('Radio Group invented ARIA role leaked into output');

          if (typeof InlineFeedback !== 'function') throw new Error('Inline Feedback public export missing');
          const errorFeedbackHtml = renderToStaticMarkup(
            React.createElement(InlineFeedback, {
              intent: 'error',
              title: 'Invitation not sent',
              message: 'Your entries are kept here; try again.',
            }),
          );
          if (!errorFeedbackHtml.includes('role="alert"')) throw new Error('Inline Feedback error alert semantics missing');
          if (!errorFeedbackHtml.includes('data-intent="error"')) throw new Error('Inline Feedback error intent missing');
          if (!errorFeedbackHtml.includes('aria-hidden="true"')) throw new Error('Inline Feedback decorative icon semantics missing');
          if (!errorFeedbackHtml.includes('Invitation not sent')) throw new Error('Inline Feedback title missing');
          if (!errorFeedbackHtml.includes('Your entries are kept here; try again.')) throw new Error('Inline Feedback message missing');

          const successFeedbackHtml = renderToStaticMarkup(
            React.createElement(InlineFeedback, { intent: 'success', message: 'Changes saved.' }),
          );
          if (!successFeedbackHtml.includes('role="status"')) throw new Error('Inline Feedback success status semantics missing');
          if (successFeedbackHtml.includes('dse-inline-feedback__title')) throw new Error('Inline Feedback derived title presence drifted');

          const reactCssUrl = import.meta.resolve('@design-system-exercise/react/styles.css');
          if (!reactCssUrl.endsWith('/dist/styles.css')) throw new Error(`Unexpected React CSS export: ${reactCssUrl}`);
          if (!existsSync(new URL(reactCssUrl))) throw new Error('React CSS export missing');
          const reactCss = readFileSync(new URL(reactCssUrl), 'utf8');
          if (!reactCss.includes('.dse-button')) throw new Error('Button stylesheet content missing');
          if (!reactCss.includes('.dse-icon-button')) throw new Error('Icon Button stylesheet content missing');
          if (!reactCss.includes('.dse-link')) throw new Error('Link stylesheet content missing');
          if (!reactCss.includes('.dse-input-control')) throw new Error('Private input shell stylesheet content missing');
          if (!reactCss.includes('.dse-text-field')) throw new Error('Text Field stylesheet content missing');
          if (!reactCss.includes('.dse-search-field')) throw new Error('Search Field stylesheet content missing');
          if (!reactCss.includes('.dse-radio-group')) throw new Error('Radio Group stylesheet content missing');
          if (!reactCss.includes('.dse-radio-option')) throw new Error('Private Radio Option stylesheet content missing');
          if (!reactCss.includes('.dse-inline-feedback')) throw new Error('Inline Feedback stylesheet content missing');
          if (!reactCss.includes('::-webkit-search-cancel-button')) throw new Error('Search Field native cancel suppression missing');

          const loaderUrl = new URL('./assets/loader-circle.svg', reactCssUrl);
          if (!existsSync(loaderUrl)) throw new Error('Button loader asset missing from installed package');
          const searchIconUrl = new URL('./assets/search.svg', reactCssUrl);
          const clearIconUrl = new URL('./assets/x.svg', reactCssUrl);
          if (!existsSync(searchIconUrl)) throw new Error('Search Field search icon asset missing from installed package');
          if (!existsSync(clearIconUrl)) throw new Error('Search Field clear icon asset missing from installed package');
          if (!readFileSync(searchIconUrl, 'utf8').includes('M9.16667 1.66666C13.3088')) {
            throw new Error('Search Field search icon asset drifted from the Figma export');
          }
          if (!readFileSync(clearIconUrl, 'utf8').includes('M11.9108 6.91073C12.2363')) {
            throw new Error('Search Field clear icon asset drifted from the Figma export');
          }

          const inlineAlertUrl = new URL('./assets/inline-feedback-alert.svg', reactCssUrl);
          const inlineCheckUrl = new URL('./assets/inline-feedback-check.svg', reactCssUrl);
          if (!existsSync(inlineAlertUrl)) throw new Error('Inline Feedback alert asset missing from installed package');
          if (!existsSync(inlineCheckUrl)) throw new Error('Inline Feedback check asset missing from installed package');
          if (!readFileSync(inlineAlertUrl, 'utf8').includes('M9.99156 1.65527')) {
            throw new Error('Inline Feedback alert asset drifted from Figma 127:30 instance');
          }
          if (!readFileSync(inlineCheckUrl, 'utf8').includes('M17.7446 2.74459')) {
            throw new Error('Inline Feedback check asset drifted from Figma 127:30 instance');
          }
          NODE
